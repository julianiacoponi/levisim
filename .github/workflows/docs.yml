name: docs

# Builds the Sphinx site on every pull request and push. On a push to main it is also deployed
# to GitHub Pages, which needs a one-time repository setting:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build the site
        env:
          MPLBACKEND: Agg
        run: sphinx-build -b html docs docs/_build/html -w docs/_build/warnings.log

      - name: Check for warnings
        # fails on any warning, from a page under docs/ or from a docstring in levisim (the
        # equivalent of sphinx-build -W --keep-going); docstring warnings are listed by object
        run: python docs/check_sphinx_warnings.py docs/_build/warnings.log

      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
