name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest Python the code runs on: dimension.py and
        # multiphysics/utils/comparison.py use `match` statements, so 3.9 (still the
        # requires-python floor in pyproject.toml) cannot even import them
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # listed here because pyproject.toml does not declare them yet (see PRs #3/#6)
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib sympy loguru tqdm pytest pytest-xdist

      - name: Run the test suite
        # pythonpath and testpaths come from pytest.ini
        env:
          MPLBACKEND: Agg
        run: python -m pytest -n auto
