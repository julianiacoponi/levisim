# Elasticsearch + Kibana for levisim's logs, in Docker.
#
# This is the FALLBACK. On Apple-silicon Macs and on Linux, `levisim-logs up` runs the same stack
# natively, without Docker (see docs/guide/logging.md). Use this file where that cannot work:
# Intel Macs (Elasticsearch has published no macOS x86_64 archive since 9.5.4) and Windows.
#
# 1. Install Docker (Docker Desktop on macOS and Windows) and start it: `docker ps` must answer.
# 2. From the repo root, start the stack:
#        docker compose up -d                (older Docker installs: docker-compose up -d)
#    The image tags below are multi-architecture, so this works on arm64 and x86_64 alike.
# 3. Wait until both services report healthy (about a minute):
#        docker compose ps
#    `curl http://localhost:9200` then prints a JSON description of the Elasticsearch node.
# 4. Let levisim send records to it as they are made: `pip install "levisim[elk]"` (or
#    `pip install elasticsearch`). Each new Python session sends every record to the
#    `loguru-logs` index as well as to the log file (~/.levisim/logs/levisim.jsonl).
# 5. Load what was logged while the stack was down, and create the Kibana data view:
#        levisim-logs ingest
#        levisim-logs open                   (prints, and opens, the Kibana Discover URL)
#    or by hand: http://localhost:5601 > Stack Management > Data views > Create, index pattern
#    `loguru-logs*`, timestamp field `timestamp`; then Discover.
# 6. Stop it with `docker compose down`. The indexed logs persist in the `levisim-es-data` volume;
#    `docker compose down -v` deletes them too.
#
# Both ports are bound to 127.0.0.1, so the stack (with security off) is not reachable from other
# machines. To use a newer release, change both tags together: Kibana must match Elasticsearch.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - levisim-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  levisim-es-data:
