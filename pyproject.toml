[build-system]
requires = ["setuptools>=42", "wheel"]  # Use setuptools and wheel for packaging
build-backend = "setuptools.build_meta" # Set setuptools as the build backend

[project]
name = "levisim"
version = "0.0.1"
authors = [
  { name = "Julian Iacoponi", email = "julian.iacoponi@gmail.com" }
]
description = "A package for levitated physics simulations"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

# NOTE: these are unpinned deliberately - the versions this code has actually been developed
# and run against are not recorded anywhere, so a lower bound would be a guess. Add floors
# once a known-good set is established.
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "sympy",
  "loguru",
  "tqdm",
]

# optional conveniences - none of these are needed to import levisim or run the physics
[project.optional-dependencies]
# ship logs to a local Elasticsearch/Kibana stack, see docker-compose.yaml
elk = ["elasticsearch"]
# desktop notifications when a long test run starts and finishes, see levisim/core/testing.py
notify = ["plyer"]
# pixel-level image comparison in levisim/multiphysics/utils/comparison.py
video = ["opencv-python"]
# running the test suite and the linter
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/julianiacoponi/levisim"
Issues = "https://github.com/julianiacoponi/levisim/issues"

[tool.setuptools]
include-package-data = true  # If you have a MANIFEST.in for non-code files

# NOTE: `packages = ["levisim"]` used to be set here, which shipped only the
# top-level directory and none of the subpackages, so an installed `levisim`
# raised `ModuleNotFoundError: No module named 'levisim.core'` on import.
# Automatic discovery picks up `levisim` and every `levisim.*` subpackage.
[tool.setuptools.packages.find]
include = ["levisim*"]
